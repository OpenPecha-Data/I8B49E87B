    footnote_ref: ༡ མེ་དཔུང་བསྣམས་པ། ༢ སྦྲུལ་ཞགས་བསྣམས་པ། ༣ སྦུད་པ་བསྣམས་པ། ༤ འཁོར་ལོ་བསྣམས་པ།
