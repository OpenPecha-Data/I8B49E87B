    footnote_ref: ༡ མེ་དཔུང་བསྣམས་པ། ༢ སྦྲུལ་ཞགས་བསྣམས་པ། ༣ སྦུད་པ་བསྣམས་པ། ༤ འཁོར་ལོ་བསྣམས་པ།
      ༥ རིན་པོ་ཆེའི་བུམ་པ་བསྣམས་པ། ༦ རི་རབ་བསྣམས་པ། ༧ རྨ་བྱ་བསྣམས་པ། ༨ ཤིང་ཏོག་བསྣམས་པ།
      ༩ སྦྲང་རྩི་བསྣམས་པ། ༡༠ རིན་ཆེན་འབར་བ་བསྣམས་པ།
